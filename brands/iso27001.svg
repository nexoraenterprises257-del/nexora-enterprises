<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 64" fill="none">
  <!-- Rounded container -->
  <rect x="1" y="1" width="208" height="62" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- ISO Crest / Ribbon Seal -->
  <g transform="translate(14, 11)">
    <!-- Outer Medallion -->
    <circle cx="21" cy="21" r="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <!-- Inner Ring -->
    <circle cx="21" cy="21" r="16" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2" stroke-dasharray="2 2"/>
    <!-- ISO Wordmark -->
    <text x="21" y="25" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="11" fill="#1E40AF" letter-spacing="-0.03em">
      ISO
    </text>
  </g>

  <!-- Typography -->
  <text x="64" y="27" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#0A0F1C" letter-spacing="-0.02em">
    ISO/IEC 27001
  </text>
  <text x="64" y="43" font-family="JetBrains Mono, monospace" font-weight="700" font-size="9" fill="#2563EB" letter-spacing="0.08em">
    CERTIFIED SECURITY
  </text>
</svg>
